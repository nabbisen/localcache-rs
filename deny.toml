# cargo-deny policy: `cargo deny check advisories sources` (RFC 027 R2)
#
# Run it with `cargo make gate-deny`. CI runs it on every push and weekly
# (`.github/workflows/advisories.yaml`). This file is the one place a
# dependency-security disposition lives: see docs/src/dependency_security.md.
# Pinned cargo-deny: 0.20.2 (Makefile.toml header and the CI workflows).

[graph]
# Every optional dependency (async-std, smol, notify, bincode, ...) must be in
# the graph, so all features are on. The graph is what can be built: all
# targets, dev-dependencies included.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Scope "all" reports unmaintained and unsound advisories for transitive
# dependencies too. The default scope hides most of them.
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "Preserve the advertised async-std runtime feature. Follow-up: Reassess if a maintained fork of async-std gains adoption, or if any vulnerability or unsound advisory is published against async-std at the locked version." },
    { id = "RUSTSEC-2025-0141", reason = "Preserve the established bincode legacy payload wire format. Follow-up: Reassess if a maintained format-compatible implementation becomes available (verify it against every historical fixture before switching), or if any vulnerability or unsound advisory is published against bincode at the locked version." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
