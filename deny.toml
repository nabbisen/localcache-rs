# cargo-deny policy: `cargo deny check advisories sources` (RFC 027 R2)
#
# Run it with `cargo make gate-deny`. CI runs it on every push, and the release
# runs it again (`.github/workflows/advisories.yaml`, which also runs weekly; the
# project does not depend on that). This file is the one place a
# dependency-security disposition lives: see docs/src/dependency_security.md.
# Pinned cargo-deny: 0.20.2 (Makefile.toml header and the CI workflows).

[graph]
# Every optional dependency (smol, notify, ...) must be in
# the graph, so all features are on. The graph is what can be built: all
# targets, dev-dependencies included.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Scope "all" reports unmaintained and unsound advisories for transitive
# dependencies too. The default scope hides most of them.
unmaintained = "all"
unsound = "all"
# No advisory is accepted: the two exceptions that existed (RUSTSEC-2025-0052 for async-std and
# RUSTSEC-2026-0441 for pin-utils, which only async-std depended on) ended in v0.26.0 with the
# removal of the async-std feature. A new exception needs its reason and the condition that ends it.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
