[workspace]
resolver = "3"
members         = [
    "crates/localcache-format",
    "crates/localcache",
    "crates/cli",
]
default-members = [
    "crates/localcache",
]

# --------------------------------------------------------------------------
# Workspace-level package metadata — member crates inherit via
# `field.workspace = true`
# --------------------------------------------------------------------------
[workspace.package]
version         = "0.25.1"
edition         = "2024"
rust-version    = "1.85"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/nabbisen/localcache-rs"
readme          = "README.md"

# --------------------------------------------------------------------------
# Workspace-level dependency versions — avoids repetition and drift between
# the library and CLI crates.
# --------------------------------------------------------------------------
[workspace.dependencies]
# workspace members
localcache              = { version = "0", path = "crates/localcache" }
# exact pin: the release preparation moves it with the workspace version (scripts/check_versions.py)
localcache-format       = { version = "=0.25.1", path = "crates/localcache-format" }
# library
rusqlite                = { version = "0.40.2", features = ["bundled", "limits"] }
serde                   = { version = "1",    features = ["derive"] }
blake3                  = "1"
thiserror               = "2"
base64                  = "0.23"
# optional features
tokio                   = { version = "1.23",  features = ["rt"] }   # < 1.23.0 affected by RUSTSEC-2023-0001
zstd                    = { version = "0.14", default-features = false }
serde_json              = "1"
aes-gcm                 = "0.10.3"    # < 0.10.3 affected by RUSTSEC-2023-0096 (the advisory floor)
zeroize                 = "1"         # RFC 029 R5: erases the copies of the key the crate holds
tracing                 = "0.1"
notify                  = "8"
notify-debouncer-mini   = "0.7"
metrics                 = "0.24"
# alternative async runtime (RFC 005)
smol                    = "2"
# cli
clap                    = { version = "4",    features = ["derive"] }
# dev / bench
tempfile                = "3"
criterion               = { version = "0.7",  features = ["html_reports"] }
sha2                    = "0.10"
