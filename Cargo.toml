[workspace]
resolver = "3"
members         = [
    "crates/localcache",
    "crates/cli",
]
default-members = [
    "crates/localcache",
]

# --------------------------------------------------------------------------
# Workspace-level package metadata — member crates inherit via
# `field.workspace = true`
# --------------------------------------------------------------------------
[workspace.package]
version         = "0.21.2"
edition         = "2024"
rust-version    = "1.85"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/nabbisen/localcache-rs"
readme          = "README.md"

# --------------------------------------------------------------------------
# Workspace-level dependency versions — avoids repetition and drift between
# the library and CLI crates.
# --------------------------------------------------------------------------
[workspace.dependencies]
# workspace members
localcache              = { version = "0", path = "crates/localcache" }
# library
rusqlite                = { version = "0.39", features = ["bundled", "limits"] }
serde                   = { version = "1",    features = ["derive"] }
bincode                 = { version = "2", features = ["serde"] }
blake3                  = "1"
thiserror               = "2"
base64                  = "0.22"
# optional features
tokio                   = { version = "1.23",  features = ["rt"] }   # < 1.23.0 affected by RUSTSEC-2023-0001
zstd                    = "0.13"
serde_json              = "1"
aes-gcm                 = "0.10.3"    # < 0.10.3 affected by RUSTSEC-2023-0096; 0.11.x still RC
tracing                 = "0.1"
notify                  = "8"
notify-debouncer-mini   = "0.7"
metrics                 = "0.24"
# opentelemetry bridge (RFC 003)
opentelemetry           = { version = "0.32", default-features = false, features = ["trace"] }
tracing-opentelemetry   = { version = "0.33", default-features = false }
# alternative async runtimes (RFC 005)
async-std               = { version = "1.13", features = ["attributes"] }
smol                    = "2"
# cli
clap                    = { version = "4",    features = ["derive"] }
# dev / bench
tempfile                = "3"
tokio-test              = { version = "1",    features = ["rt", "macros", "rt-multi-thread"] }
criterion               = { version = "0.7",  features = ["html_reports"] }
sha2                    = "0.10"
