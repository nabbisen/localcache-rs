# closed rather than silently attempting verification. Unlike
# [canonical-tools], no per-binary SHA-256 is required — the exact bytes of
# a system python3/git/mdbook install are platform- and package-manager-
# specific and were never meant to be portable across hosts, only the tool
# identity and version.
