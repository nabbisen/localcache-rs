schema-version = 1

# RFC 017 retired the canonical-producer contract (Docker image pin, pinned
# host-tool versions/hashes, base-component hashes) that used to live here.
# Toolchain identity (platform, git, Python, zlib, locale, timezone, compiler
# versions) is now recorded per run in evidence rather than pinned in this
# file — see `scripts/release.py`'s `toolchain_identity`. Only the gate
# scripts themselves are still hash-pinned below, for supply-chain integrity
# (RFC 009 R12).

[implementations.release-runner]
path = "scripts/release.py"
sha256 = "eadde108dc6651403d7be875a6d12740b14bfce23a09df593917f763de8be0ef"

