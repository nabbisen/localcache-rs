# Makefile.toml — cargo-make task runner for localcache
#
# Install:  cargo install cargo-make --version 0.37.24 --locked
# Usage:    cargo make <task>
#
# Gates (the same tasks CI runs; RFC 027):
#   cargo make gate-features  — feature assertion, clippy and tests on every row
#   cargo make gate-msrv      — declared-MSRV check (rustup run 1.85 cargo make gate-msrv)
#   cargo make gate-deny      — advisories and sources (deny.toml)
#   cargo make gate-versions  — script tests; install examples and CHANGELOG name the version
#   cargo make gate-docs      — rustdoc, mdBook, cargo package (needs a committed tree)
#   cargo make gate-archive   — the source archive, checked and built (needs a committed tree)
#   cargo make fmt-check      — formatting
#   cargo make bench-compile  — verify benchmarks compile
#
# Tasks not listed here are cargo-make built-ins, not the project's gates; the
# supported commands are the `gate-*` tasks and the tasks listed above.
#
# Pinned tools (cargo install <tool> --version <v> --locked): cargo-make
# 0.37.24, cargo-hack 0.6.45, cargo-deny 0.20.2.
#
# Publishing is owner-only and manual: `cargo publish --workspace --locked`
# (RFC 009 R15), after CI is green on the commit.

[config]
default_to_workspace = false

# ---------------------------------------------------------------------------
# Formatting & linting
# ---------------------------------------------------------------------------

[tasks.fmt-check]
description = "Check formatting (all crates)"
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.fmt]
description = "Apply formatting (all crates)"
command = "cargo"
args = ["fmt", "--all"]

# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------

[tasks.bench-compile]
description = "Verify benchmarks compile (no actual run)"
command = "cargo"
args = ["bench", "-p", "localcache", "--bench", "cache_bench", "--no-run", "--features", "json", "--locked"]

[tasks.bench]
description = "Run benchmarks"
command = "cargo"
args = ["bench", "-p", "localcache", "--bench", "cache_bench", "--features", "json", "--locked"]

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

[tasks.doc]
description = "Build documentation with all features"
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--all-features", "--open"]

[tasks.doc-check]
description = "Check documentation builds cleanly"
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--all-features", "--locked"]

# ---------------------------------------------------------------------------
# Publish checks
# ---------------------------------------------------------------------------

[tasks.package-check]
description = "Check what will be included in the crates.io package"
command = "cargo"
args = ["package", "--list", "--allow-dirty"]

[tasks.package-dry-run]
description = "Dry-run package build for the library crate"
command = "cargo"
args = ["package", "--no-verify", "--allow-dirty"]

# ---------------------------------------------------------------------------
# RFC 027 — the standard gates
#
# Each gate is the literal command; CI (`.github/workflows/ci.yaml`) runs these
# same tasks, so the local command is the CI command. Pinned tools (installed
# with `cargo install <tool> --version <v> --locked`): cargo-make 0.37.24,
# cargo-hack 0.6.45, cargo-deny 0.20.2. Where they are pinned: this header and
# the "Cache pinned gate tools" steps of `ci.yaml`, `advisories.yaml` and
# `msrv-fresh.yaml`.
# ---------------------------------------------------------------------------

[tasks.gate-features-assert]
description = "Fail if a localcache Cargo feature is missing from the list the gate rows name"
# Every library feature. `--each-feature` below covers each one alone; the two
# suite rows combine the runtime features with the companions named in them.
# Adding a feature means adding it here and deciding whether the suites need it.
env = { GATE_LIBRARY_FEATURES = "async async-std smol compression json encryption tracing watching metrics opentelemetry" }
script = [
    '''
    declared=$(python3 -c "import tomllib; print(*sorted(tomllib.load(open('crates/localcache/Cargo.toml','rb'))['features']))")
    named=$(printf '%s\n' $GATE_LIBRARY_FEATURES | sort | tr '\n' ' ' | sed 's/ $//')
    if [ "$declared" != "$named" ]; then
        echo "ERROR: features declared in crates/localcache/Cargo.toml: $declared"
        echo "       features the gate rows name:                       $named"
        exit 1
    fi
    echo "OK: the gate rows name every localcache feature"
    '''
]

[tasks.gate-clippy]
description = "Clippy (-D warnings) on every feature row: library each-feature, the two runtime suites, the CLI"
script = [
    '''
    set -e
    cargo hack clippy -p localcache --each-feature --all-targets --locked -- -D warnings
    cargo clippy -p localcache --all-targets --no-default-features --features async-std,compression,json,encryption,tracing,watching,metrics --locked -- -D warnings
    cargo clippy -p localcache --all-targets --no-default-features --features smol,compression,json,encryption,tracing,watching,metrics --locked -- -D warnings
    cargo clippy -p localcache-cli --all-targets --locked -- -D warnings
    cargo clippy -p localcache-cli --all-targets --all-features --locked -- -D warnings
    '''
]

[tasks.gate-test]
description = "Tests on every feature row, and the workspace doctests"
script = [
    '''
    set -e
    cargo hack test -p localcache --each-feature --all-targets --locked
    cargo test -p localcache --all-targets --no-default-features --features async-std,compression,json,encryption,tracing,watching,metrics --locked
    cargo test -p localcache --all-targets --no-default-features --features smol,compression,json,encryption,tracing,watching,metrics --locked
    cargo test -p localcache-cli --all-targets --locked
    cargo test -p localcache-cli --all-targets --all-features --locked
    cargo test --workspace --doc --all-features --locked
    '''
]

[tasks.gate-features]
description = "The feature matrix: assertion, clippy, tests"
dependencies = ["gate-features-assert", "gate-clippy", "gate-test"]

[tasks.gate-deny]
description = "Dependency security: advisories and sources (deny.toml); a stale ignore fails"
command = "cargo"
args = ["deny", "--locked", "check", "-D", "advisory-not-detected", "advisories", "sources"]

[tasks.gate-msrv]
description = "Declared-MSRV cargo check on the four MSRV rows (RFC 014 R8). Locally: rustup run 1.85 cargo make gate-msrv"
# The toolchain is whatever `cargo` resolves to: CI installs the declared MSRV
# as the job's default; locally `rustup run 1.85 cargo make gate-msrv` does it.
# The rows are the old `MSRV_ROW_NAMES`: lib-all-features, lib-feature-async-std,
# lib-feature-smol, cli-all-features. async-std and smol each get their own
# row because Tokio takes priority under --all-features, so all-features alone
# never compiles those backends.
script = [
    '''
    set -ex
    cargo check -p localcache --all-targets --all-features --locked
    cargo check -p localcache --all-targets --no-default-features --features async-std --locked
    cargo check -p localcache --all-targets --no-default-features --features smol --locked
    cargo check -p localcache-cli --all-targets --all-features --locked
    '''
]

[tasks.gate-versions]
description = "Script tests, then install examples and CHANGELOG name the workspace version (RFC 009 R10, R11)"
script = [
    '''
    set -e
    python3 -m unittest discover -s scripts/tests
    python3 scripts/check_versions.py
    '''
]

[tasks.gate-docs]
description = "Rustdoc (warnings fail), mdBook and the joint package check (RFC 009 R9). Needs a clean committed tree."
# The three commands of the old `doc-package` gate, with rustdoc warnings made
# fatal on the `cargo doc` command only (RFC 027 Q9b-3). `cargo package`
# refuses a dirty tree and builds each crate from its packaged files.
script = [
    '''
    set -ex
    RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked
    mdbook build docs
    cargo package --workspace --locked
    '''
]

[tasks.gate-archive]
description = "Build the source archive from HEAD, check it is complete, and build from the extracted copy (RFC 009 R2, R6; RFC 027 R3)"
# `localcache-v<version>.tar.gz` is `git archive` of HEAD with the files at the
# archive root (RFC 009 R4; the "v" is in the file name only). Nothing untrusted
# produces this file, so there is no tar parser and no determinism check.
# Everything is built outside the repository and removed afterwards. Needs a
# committed tree: the archive is of HEAD.
script = [
    '''
    set -eu
    VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
    NAME="localcache-v${VERSION}.tar.gz"
    OUT=$(mktemp -d)
    trap 'rm -rf "$OUT"' EXIT

    git archive --format=tar.gz -o "$OUT/$NAME" HEAD

    # Complete: the members are exactly the tracked files, and nothing that is
    # build output or repository metadata.
    tar tzf "$OUT/$NAME" | grep -v '/$' | LC_ALL=C sort > "$OUT/members.txt"
    git -c core.quotepath=off ls-files | LC_ALL=C sort > "$OUT/tracked.txt"
    diff "$OUT/tracked.txt" "$OUT/members.txt"
    if grep -E '(^|/)(\.git|\.git-exclude|target)(/|$)|^docs/book(/|$)' "$OUT/members.txt"; then
        echo "ERROR: the archive contains build output or repository metadata" >&2
        exit 1
    fi

    # Builds: from a new empty directory, with build output outside the source.
    mkdir "$OUT/src"
    tar xzf "$OUT/$NAME" -C "$OUT/src"
    export CARGO_TARGET_DIR="$OUT/target"
    cargo metadata --locked --format-version 1 --manifest-path "$OUT/src/Cargo.toml" > /dev/null
    cargo check --workspace --all-targets --locked --manifest-path "$OUT/src/Cargo.toml"
    mdbook build "$OUT/src/docs" --dest-dir "$OUT/book"

    echo "$(sha256sum < "$OUT/$NAME" | cut -d' ' -f1)  $NAME ($(wc -c < "$OUT/$NAME") bytes)"
    '''
]
