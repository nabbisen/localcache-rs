# Makefile.toml — cargo-make task runner for localcache
#
# Install:  cargo install cargo-make
# Usage:    cargo make <task>
#
# Common tasks:
#   cargo make check          — fmt + clippy (all feature combinations)
#   cargo make test           — full test suite with all features
#   cargo make source-integrity — verify manifest target sources without Cargo
#   cargo make bench-compile  — verify benchmarks compile
#   cargo make pre-publish    — all checks before publishing
#   cargo make publish-lib    — publish localcache to crates.io
#   cargo make publish-cli    — publish localcache-cli to crates.io
#   cargo make publish-all    — publish both (lib first)

[config]
default_to_workspace = false

# ---------------------------------------------------------------------------
# Bootstrap source integrity
# ---------------------------------------------------------------------------

[tasks.source-integrity]
description = "Verify manifest target sources without invoking Cargo"
command = "python3"
args = ["scripts/source_integrity.py", "--require-tracked"]

[tasks.source-integrity-test]
description = "Test the bootstrap source-integrity preflight"
command = "python3"
args = ["-m", "unittest", "discover", "-s", "scripts/tests", "-v"]

# ---------------------------------------------------------------------------
# Formatting & linting
# ---------------------------------------------------------------------------

[tasks.fmt-check]
description = "Check formatting (all crates)"
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.fmt]
description = "Apply formatting (all crates)"
command = "cargo"
args = ["fmt", "--all"]

# ---------------------------------------------------------------------------
# Canonical RFC 009 R7 / R12 matrix — scripts/feature_matrix.py is the single
# checked-in source of truth for rows; these tasks are thin aliases over it,
# not an independent command list.
# ---------------------------------------------------------------------------

[tasks.matrix-coverage-check]
description = "Fail closed if a declared Cargo feature has no matrix row"
command = "python3"
args = ["scripts/feature_matrix.py", "--check-coverage"]

[tasks.matrix-clippy]
description = "Clippy (-D warnings) across every canonical matrix row"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-all", "--modes", "clippy"]

[tasks.matrix-test]
description = "Test across every canonical matrix row"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-all", "--modes", "test"]

[tasks.matrix]
description = "Full canonical matrix: clippy + test, every row"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-all"]

[tasks.clippy-default]
description = "Clippy: localcache with no optional features"
command = "python3"
args = ["scripts/feature_matrix.py", "--run", "lib-no-features", "--modes", "clippy"]

[tasks.clippy-all]
description = "Clippy: localcache with all features enabled"
command = "python3"
args = ["scripts/feature_matrix.py", "--run", "lib-all-features", "--modes", "clippy"]

[tasks.clippy-min]
description = "Clippy: localcache with no optional features (alias of clippy-default)"
command = "python3"
args = ["scripts/feature_matrix.py", "--run", "lib-no-features", "--modes", "clippy"]

[tasks.check]
description = "Format check + coverage check + clippy across the canonical matrix"
dependencies = [
    "source-integrity-test",
    "source-integrity",
    "fmt-check",
    "matrix-coverage-check",
    "matrix-clippy",
]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tasks.test]
description = "Run tests: localcache with all features"
command = "python3"
args = ["scripts/feature_matrix.py", "--run", "lib-all-features", "--modes", "test"]

[tasks.test-default]
description = "Run tests: localcache with default (no optional) features"
command = "python3"
args = ["scripts/feature_matrix.py", "--run", "lib-no-features", "--modes", "test"]

[tasks.test-no-features]
description = "Run tests: localcache with no optional features (alias of test-default)"
command = "python3"
args = ["scripts/feature_matrix.py", "--run", "lib-no-features", "--modes", "test"]

[tasks.test-all]
description = "Run tests across the full canonical matrix (every row)"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-all", "--modes", "test"]

# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------

[tasks.bench-compile]
description = "Verify benchmarks compile (no actual run)"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-bench-compile"]

[tasks.bench]
description = "Run benchmarks (requires --features json)"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-bench"]

# ---------------------------------------------------------------------------
# Declared-MSRV matrix (RFC 014 R8) — rows come from
# scripts/feature_matrix.py's MSRV_ROW_NAMES, not a hand-written list here.
# ---------------------------------------------------------------------------

[tasks.msrv-check]
description = "Run the declared-MSRV cargo-check matrix"
command = "python3"
args = ["scripts/feature_matrix.py", "--run-msrv"]

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

[tasks.doc]
description = "Build documentation with all features"
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--all-features", "--open"]

[tasks.doc-check]
description = "Check documentation builds cleanly"
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--all-features", "--locked"]

# ---------------------------------------------------------------------------
# Publish checks
# ---------------------------------------------------------------------------

[tasks.package-check]
description = "Check what will be included in the crates.io package"
command = "cargo"
args = ["package", "--list", "--allow-dirty"]

[tasks.package-dry-run]
description = "Dry-run package build for the library crate"
command = "cargo"
args = ["package", "--no-verify", "--allow-dirty"]

[tasks.pre-publish]
description = "All checks required before publishing"
dependencies = [
    "source-integrity",
    "fmt-check",
    "matrix-coverage-check",
    "matrix",
    "bench-compile",
    "doc-check",
    "package-check",
]

# ---------------------------------------------------------------------------
# Publish tasks
# ---------------------------------------------------------------------------

[tasks.publish-lib]
description = "Publish localcache (library) to crates.io"
dependencies = ["pre-publish"]
command = "cargo"
args = ["publish", "-p", "localcache"]

[tasks.publish-cli-only]
description = "Publish localcache-cli to crates.io (run after publish-lib)"
command = "cargo"
args = ["publish", "-p", "localcache-cli"]

[tasks.publish-all]
description = "Publish library then CLI (waits for library to propagate)"
script = [
    "cargo make publish-lib",
    "echo 'Waiting 30 s for crates.io to index localcache...'",
    "sleep 30",
    "cargo make publish-cli-only",
]

# ---------------------------------------------------------------------------
# Release helpers
# ---------------------------------------------------------------------------

[tasks.changelog-check]
description = "Verify CHANGELOG.md has an entry for the current version"
script = [
    '''
    VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)[\"packages\"]; print(next(p[\"version\"] for p in pkgs if p[\"name\"]==\"localcache\"))")
    echo "Checking CHANGELOG for v${VERSION}..."
    grep -q "## \\[${VERSION}\\]" CHANGELOG.md && echo "OK: found [${VERSION}]" || (echo "ERROR: no entry for [${VERSION}] in CHANGELOG.md" && exit 1)
    '''
]

[tasks.version-check]
description = "Verify both workspace package versions match"
script = [
    '''
    LIB=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)[\"packages\"]; print(next(p[\"version\"] for p in pkgs if p[\"name\"]==\"localcache\"))")
    CLI=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)[\"packages\"]; print(next(p[\"version\"] for p in pkgs if p[\"name\"]==\"localcache-cli\"))")
    echo "localcache:     ${LIB}"
    echo "localcache-cli: ${CLI}"
    [ "${LIB}" = "${CLI}" ] && echo "OK: versions match" || (echo "ERROR: version mismatch" && exit 1)
    '''
]

[tasks.security-check]
description = "Run the RFC 009 R13 fail-closed dependency-security gate"
command = "python3"
args = [
    "scripts/release.py",
    "security",
    "--output-dir",
    ".git-exclude/security-evidence",
]

[tasks.release-check]
description = "Full pre-release checklist"
dependencies = ["version-check", "changelog-check", "security-check", "pre-publish"]

# ---------------------------------------------------------------------------
# RFC 009 M1 source archive verification
#
# Produces below .git-exclude/release-output/:
#   localcache-vX.Y.Z.tar.gz
#   evidence/
#
# Project files are at archive root. The runner refuses a dirty checkout,
# validates raw headers before extraction, and runs the M1 smoke gates from
# both the checkout and a Git-free fresh extraction. RFC 017 retired the
# canonical/noncanonical distinction: this runs on any supported host, and
# the uncompressed-tar digest is the same-host determinism gate (R2).
# ---------------------------------------------------------------------------

[tasks.archive]
description = "Construct and verify the RFC 009/017 project source archive"
command = "python3"
args = [
    "scripts/release.py",
    "source",
    "--output-dir",
    ".git-exclude/release-output",
]
