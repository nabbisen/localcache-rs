[package]
name        = "localcache-cli"
description = "CLI inspection and maintenance tool for localcache databases"
readme.workspace        = true
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[[bin]]
name = "localcache"
path = "src/main.rs"

[features]
watching = ["localcache/watching"]

[dependencies]
localcache      = { workspace = true, features = ["compression", "json"] }
clap            = { workspace = true }
serde_json      = { workspace = true }

[dev-dependencies]
tempfile        = { workspace = true }
