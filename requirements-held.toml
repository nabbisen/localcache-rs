# Declared dependency requirements that do not admit the newest stable version on
# crates.io, each with the reason and the condition that ends the hold (Q25).
#
# `cargo make gate-requirements` (scripts/check_requirements.py) fails the release
# unless every declared requirement admits the newest version or has a row here:
#   crate        the dependency (or `SQLite (bundled)`: the SQLite inside the locked libsqlite3-sys, compared with
#                the latest SQLite release; its `requirement` is the bundled version, e.g. "3.53.2")
#   requirement  exactly as `cargo metadata` prints the declared requirement ("^0.40.2")
#   latest       the newest stable version this row was written against; when a newer
#                one is published the row fails, so the decision is made again
#   why          why the requirement is held
#   ends         the condition that ends the hold, in the style of the deny.toml follow-ups
# A row for a requirement that now passes, or that no workspace member declares any more,
# fails too: the release that ends a hold deletes its row. The table in
# docs/src/dependency_security.md is generated from this file
# (`python3 scripts/check_requirements.py --write-book`) and checked against it.
# The MSRV is raised only for a named necessity (RFC 023); a development tool never justifies it.
# An empty file means nothing is held: every declared requirement admits the newest version.
