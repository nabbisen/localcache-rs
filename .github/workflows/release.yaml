name: Release

# RFC 027 R5: publishing both crates through crates.io Trusted Publishing. No
# long-lived registry token is used here.
#
# A real run starts only when the project owner starts it by hand
# (`workflow_dispatch`) with `dry_run` switched off, on a tag the owner has
# pushed: annotated (signed on the owner's machine), no `v` prefix, and equal to
# the workspace version, which is a SemVer version, pre-releases included
# (`0.22.0`, `1.1.1-rc.1`). There is no approval pause: the `release` Environment
# has deployment rules (branch `main`, version tags) and no required reviewer.
# `dry_run` is true unless the owner switches it off; a dry run may also run from
# `main`, which is how the trust chain is rehearsed before a release
# (docs/src/source_archives.md).
#
# Jobs: `gate` checks the tag and the commit; `advisories` and `msrv-fresh` are
# the two scheduled checks, run again at the moment of release; `archive` builds
# and attests the source archive; `publish` is the only job that asks crates.io
# for a token, and it runs in the `release` Environment (the crates.io
# trusted-publisher records name this repository and this workflow, not an
# environment); `github-release` creates the hosted release, as a pre-release
# when the version has a pre-release part, and runs only when `dry_run` is false.
#
# Same posture as ci.yaml (RFC 009 R16): read-only by default, every action
# pinned to a full commit SHA with its version, no secrets, and nothing external
# (inputs, ref names) is interpolated into a script: it goes through `env:`.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse everything except publishing and the hosted release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check what was dispatched
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
              echo "dispatched from tag $REF_NAME (dry_run=$DRY_RUN)"
          elif [ "$REF_TYPE" = "branch" ] && [ "$DRY_RUN" = "true" ] && [ "$REF_NAME" = "main" ]; then
              echo "rehearsal: dry run from main"
          else
              echo "A release runs from a tag; only a dry run may run from main." >&2
              echo "ref_type=$REF_TYPE ref=$REF_NAME dry_run=$DRY_RUN" >&2
              exit 1
          fi
      - name: Check the tag against the workspace version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          WORKSPACE=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$REF_TYPE" = "tag" ]; then
              case "$REF_NAME" in
                  v*)
                      echo "Tag '$REF_NAME' starts with v. Tags carry no v prefix." >&2
                      exit 1
                      ;;
              esac
              if [ "$(git cat-file -t "refs/tags/$REF_NAME")" != "tag" ]; then
                  echo "Tag '$REF_NAME' is lightweight. Create an annotated, signed tag: git tag -s $REF_NAME" >&2
                  exit 1
              fi
              if [ "$REF_NAME" != "$WORKSPACE" ]; then
                  echo "Tag '$REF_NAME' does not equal the workspace version '$WORKSPACE'." >&2
                  exit 1
              fi
          fi
          echo "version=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "version $WORKSPACE"
      - name: Check the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Commit $GITHUB_SHA is not reachable from origin/main." >&2
              exit 1
          fi
          echo "$GITHUB_SHA is on main"
      - name: Check CI is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          result=$(gh run list --workflow ci.yaml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq 'if length == 0 then "none" else (.[0] | "\(.status) \(.conclusion)") end')
          echo "newest ci.yaml run on $GITHUB_SHA: $result"
          if [ "$result" != "completed success" ]; then
              echo "CI is not green on this commit." >&2
              exit 1
          fi
      - name: Check install examples and CHANGELOG name the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/check_versions.py --expect "$VERSION"

  advisories:
    name: Advisories
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/advisories.yaml

  msrv-fresh:
    name: MSRV fresh resolution
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/msrv-fresh.yaml

  archive:
    name: Source archive
    needs: [gate, advisories, msrv-fresh]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the source archive
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # `git archive` of this commit, files at the archive root. The "v" is
          # in the file name only (RFC 009 R4). CI ran `gate-archive` on this
          # commit; the gate job checked that.
          git archive --format=tar.gz -o "$RUNNER_TEMP/localcache-v${VERSION}.tar.gz" HEAD
          DIGEST=$(sha256sum < "$RUNNER_TEMP/localcache-v${VERSION}.tar.gz" | cut -d' ' -f1)
          echo "$DIGEST  localcache-v${VERSION}.tar.gz"
          echo "localcache-v${VERSION}.tar.gz  sha256 $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-archive
          path: ${{ runner.temp }}/localcache-v${{ needs.gate.outputs.version }}.tar.gz
          if-no-files-found: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/localcache-v${{ needs.gate.outputs.version }}.tar.gz

  publish:
    name: Publish
    needs: [gate, archive]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Exchange the OIDC identity for a short-lived registry token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Not piped: the status of cargo publish is the status of this step.
          set +e
          if [ "$DRY_RUN" = "true" ]; then
              cargo publish --workspace --locked --dry-run > "$RUNNER_TEMP/publish.log" 2>&1
          else
              cargo publish --workspace --locked > "$RUNNER_TEMP/publish.log" 2>&1
          fi
          status=$?
          cat "$RUNNER_TEMP/publish.log"
          exit $status
      - name: Record the .crate digests
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # Fails closed: it succeeds only after recording exactly two digests,
          # each 64 hexadecimal characters, for `localcache` and `localcache-cli`
          # at this version; anything else is an error.
          #
          # The two sources differ on purpose. A dry run keeps the packaged
          # `.crate` files in target/package, so it hashes those. A real
          # `cargo publish` does not, and what users download is what crates.io
          # serves, so a real run hashes those bytes (the file can lag the
          # publish by seconds: at most 10 tries, 6 s apart).
          set -euo pipefail
          OUT="$RUNNER_TEMP/crate-digests.txt"
          : > "$OUT"
          for name in localcache localcache-cli; do
              file="${name}-${VERSION}.crate"
              if [ "$DRY_RUN" = "true" ]; then
                  path="target/package/$file"
              else
                  path="$RUNNER_TEMP/$file"
                  url="https://static.crates.io/crates/${name}/${file}"
                  tries=1
                  until curl --fail --silent --show-error --location --output "$path" "$url"; do
                      if [ "$tries" -ge 10 ]; then
                          echo "Could not download $url in 10 tries." >&2
                          exit 1
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
              fi
              if [ ! -s "$path" ]; then
                  echo "$path is missing or empty." >&2
                  exit 1
              fi
              sum=$(sha256sum "$path")
              digest="${sum%% *}"
              if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
                  echo "Not a SHA-256 digest for $file: '$digest'" >&2
                  exit 1
              fi
              printf '%s  %s\n' "$digest" "$file" >> "$OUT"
          done
          if [ "$(wc -l < "$OUT")" -ne 2 ]; then
              echo "Expected exactly two digests." >&2
              exit 1
          fi
          cat "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-digests
          path: ${{ runner.temp }}/crate-digests.txt
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: ${{ !inputs.dry_run }}
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-archive
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-digests
          path: ${{ runner.temp }}/release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          DIR="$RUNNER_TEMP/release"
          # Refuse to publish notes without both .crate digests: exactly two
          # lines, one per crate, each a 64-hex digest and the file name. (The
          # name is compared as a string, not matched, because a version may
          # contain characters that are special in a pattern.)
          if [ "$(wc -l < "$DIR/crate-digests.txt")" -ne 2 ]; then
              echo "crate-digests.txt must have exactly two lines." >&2
              exit 1
          fi
          for name in localcache localcache-cli; do
              found=$(awk -v want="${name}-${VERSION}.crate" '
                  NF == 2 && length($1) == 64 && $1 ~ /^[0-9a-f]+$/ && $2 == want { n++ }
                  END { print n + 0 }
              ' "$DIR/crate-digests.txt")
              if [ "$found" -ne 1 ]; then
                  echo "crate-digests.txt has no valid digest line for ${name}-${VERSION}.crate." >&2
                  exit 1
              fi
          done
          # A pre-release has a "-" before any build metadata ("+...", which may
          # itself contain "-").
          flags=()
          core="${VERSION%%+*}"
          case "$core" in *-*) flags+=(--prerelease) ;; esac
          {
              # The CHANGELOG section of this version, then the digests.
              awk -v v="$VERSION" '
                  /^## \[/ { printing = (index($0, "## [" v "]") == 1); next }
                  printing { print }
              ' CHANGELOG.md
              echo
              echo "## Checksums (SHA-256)"
              echo
              echo '```text'
              echo "$(sha256sum < "$DIR/localcache-v${VERSION}.tar.gz" | cut -d' ' -f1)  localcache-v${VERSION}.tar.gz"
              cat "$DIR/crate-digests.txt"
              echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" "${flags[@]}" \
              --notes-file "$RUNNER_TEMP/notes.md" "$DIR/localcache-v${VERSION}.tar.gz"
