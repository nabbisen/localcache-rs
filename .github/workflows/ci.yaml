name: CI

# RFC 022 R3 items 6-7 (Amendment 3): the runner image (ubuntu-24.04) and the
# artifact-action pins change only by a deliberate, CI-verified change -- never
# silently via `ubuntu-latest` or an unpinned action tag drifting underneath us.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# RFC 009 R16: every workflow and job is read-only by default. No job in this
# workflow needs to write repository contents, packages, or releases, and
# none receives publish/registry/repository secrets. This workflow also never
# uses `pull_request_target`, so untrusted PR code never runs with elevated
# permissions or secret access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test source-integrity preflight
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify manifest target sources
        run: python3 scripts/source_integrity.py --require-tracked

  fmt:
    name: Format check
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  # RFC 027 Q9a/Q9b: the feature matrix is `cargo make gate-features`
  # (`cargo hack --each-feature` plus the two runtime-suite rows, the CLI rows
  # and the doctests), so the local command is the CI command.
  # Same R16 posture as every job here: read-only, no secrets, pinned actions.
  standard-gates:
    name: Standard gates (feature matrix)
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-24.04-cargo-standard-gates-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache pinned gate tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-make
            ~/.cargo/bin/cargo-hack
          key: ubuntu-24.04-gate-tools-make-0.37.24-hack-0.6.45
      - name: Install pinned gate tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-make --version 0.37.24 --locked
          cargo install cargo-hack --version 0.6.45 --locked
      - name: Feature matrix (assertion, clippy, tests)
        run: cargo make gate-features

  standard-deny:
    name: Standard gates (dependency security)
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache pinned gate tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-make
            ~/.cargo/bin/cargo-deny
          key: ubuntu-24.04-gate-tools-make-0.37.24-deny-0.20.2
      - name: Install pinned gate tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-make --version 0.37.24 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      # Deliberately no advisory-database cache: a cached database would hide
      # exactly what this gate exists to find. A failed fetch fails the job.
      - name: cargo deny (advisories and sources, a stale ignore fails)
        run: cargo make gate-deny

  bench-compile:
    name: Bench (compile-only)
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-24.04-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache pinned gate tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-make
          key: ubuntu-24.04-gate-tools-make-0.37.24
      - name: Install pinned gate tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install cargo-make --version 0.37.24 --locked
      - name: Check bench compiles
        run: cargo make bench-compile

  msrv:
    name: MSRV (declared Rust 1.85)
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read declared MSRV
        id: msrv
        run: |
          MSRV=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          test "$MSRV" = "1.85"
          echo "toolchain=${MSRV}.0" >> "$GITHUB_OUTPUT"
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-24.04-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache pinned gate tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-make
          key: ubuntu-24.04-gate-tools-make-0.37.24
      - name: Install pinned gate tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install cargo-make --version 0.37.24 --locked
      - name: Check the declared-MSRV matrix (RFC 009 R8)
        run: cargo make gate-msrv

  dependency-security:
    name: Dependency security policy
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run fail-closed advisory policy (RFC 009 R13)
        run: >-
          python3 scripts/release.py security
          --output-dir "$RUNNER_TEMP/localcache-advisory-evidence"
      - name: Preserve advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-evidence
          path: ${{ runner.temp }}/localcache-advisory-evidence
          if-no-files-found: error

  # RFC 009 M6c item 3, RFC 017: builds and verifies the project source
  # archive on this runner. RFC 017 retired the canonical Docker producer and
  # the canonical/noncanonical distinction entirely — this is now the
  # ordinary archive gate, and it runs on any supported host. Uploads the
  # archive and its evidence as a CI artifact only; this job never tags,
  # publishes, or creates a release.
  archive:
    name: Project archive
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install mdbook
        run: |
          curl -fL --retry 3 \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/mdbook.tar.gz"
          printf '%s  %s\n' \
            3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7 \
            "$RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$HOME/.local/bin" mdbook
          chmod 0755 "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and verify project source archive (RFC 009 R3-R6)
        run: >-
          python3 scripts/release.py source
          --output-dir "$RUNNER_TEMP/localcache-archive"
      - name: Preserve archive and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-archive-evidence
          path: ${{ runner.temp }}/localcache-archive
          if-no-files-found: error

  # RFC 009 R9 / M6e items 7-8: rustdoc, mdBook, and joint cargo package
  # --workspace verification. Uploads doc/package evidence only; never
  # publishes to a registry.
  doc-package:
    name: Docs and package verification
    needs: source-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install mdbook
        run: |
          curl -fL --retry 3 \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/mdbook.tar.gz"
          printf '%s  %s\n' \
            3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7 \
            "$RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$HOME/.local/bin" mdbook
          chmod 0755 "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-24.04-cargo-doc-package-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo doc, mdbook build, cargo package --workspace (RFC 009 R9)
        run: >-
          python3 scripts/release.py doc-package
          --output-dir "$RUNNER_TEMP/localcache-doc-package-evidence"
      - name: Preserve doc/package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-package-evidence
          path: ${{ runner.temp }}/localcache-doc-package-evidence
          if-no-files-found: error

  # RFC 009 M6c item 3: the final fail-closed gate. Runs even if an earlier
  # job failed (`if: always()`) so it reports the exact binding failure
  # instead of being silently skipped. It is the only job that reads
  # `needs.*.result`, `github.run_id`, and `github.sha` — every other gate is
  # CI-agnostic and runs identically locally via `scripts/release.py`.
  release-gate:
    name: Release gate aggregation
    if: always()
    needs:
      - source-integrity
      - fmt
      - standard-gates
      - bench-compile
      - msrv
      - dependency-security
      - archive
      - doc-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dependency-security evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-security-evidence
          path: ${{ runner.temp }}/dependency-security-evidence
      - name: Download project archive evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: project-archive-evidence
          path: ${{ runner.temp }}/project-archive-evidence
      - name: Download doc/package evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doc-package-evidence
          path: ${{ runner.temp }}/doc-package-evidence
      - name: Aggregate and verify CI provenance
        run: >-
          python3 scripts/release.py aggregate-ci
          --output-dir "$RUNNER_TEMP/release-gate-evidence"
          --run-id "${{ github.run_id }}"
          --sha "${{ github.sha }}"
          --require-job "source-integrity=${{ needs.source-integrity.result }}"
          --require-job "fmt=${{ needs.fmt.result }}"
          --require-job "standard-gates=${{ needs.standard-gates.result }}"
          --require-job "bench-compile=${{ needs.bench-compile.result }}"
          --require-job "msrv=${{ needs.msrv.result }}"
          --require-job "dependency-security=${{ needs.dependency-security.result }}"
          --require-job "archive=${{ needs.archive.result }}"
          --require-job "doc-package=${{ needs.doc-package.result }}"
          --evidence-manifest "$RUNNER_TEMP/dependency-security-evidence/manifest.json"
          --evidence-manifest "$RUNNER_TEMP/project-archive-evidence/evidence/manifest.json"
          --evidence-manifest "$RUNNER_TEMP/doc-package-evidence/manifest.json"
      - name: Preserve aggregation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-evidence
          path: ${{ runner.temp }}/release-gate-evidence
          if-no-files-found: error
