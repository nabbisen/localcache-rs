name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test source-integrity preflight
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify manifest target sources
        run: python3 scripts/source_integrity.py --require-tracked

  test:
    name: Test (${{ matrix.features }})
    needs: source-integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "async"
          - "async-std"
          - "smol"
          - "compression"
          - "json"
          - "encryption"
          - "tracing"
          - "watching"
          - "metrics"
          - "opentelemetry"
          - "async,compression,json,encryption,tracing,watching,metrics,opentelemetry"
          - "async-std,compression,json,encryption,tracing,watching,metrics"
          - "smol,compression,json,encryption,tracing,watching,metrics"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -z "$FEATURES" ]; then
            cargo clippy --all-targets
          else
            cargo clippy --all-targets --features "$FEATURES"
          fi

      - name: Test
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -z "$FEATURES" ]; then
            cargo test --all-targets
          else
            cargo test --all-targets --features "$FEATURES"
          fi

  bench-compile:
    name: Bench (compile-only)
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Check bench compiles
        run: >-
          cargo bench -p localcache --bench cache_bench --no-run
          --features localcache/json --locked

  msrv:
    name: MSRV (declared Rust 1.85)
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read declared MSRV
        id: msrv
        run: |
          MSRV=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          test "$MSRV" = "1.85"
          echo "toolchain=${MSRV}.0" >> "$GITHUB_OUTPUT"
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Verify declared toolchain
        run: |
          rustc --version | grep -E '^rustc 1\.85\.0 '
          cargo --version | grep -E '^cargo 1\.85\.0 '
      - name: Check complete declared-MSRV matrix
        run: |
          cargo check -p localcache --all-targets --all-features --locked
          cargo check -p localcache --all-targets --no-default-features --features localcache/async-std --locked
          cargo check -p localcache --all-targets --no-default-features --features localcache/smol --locked
          cargo check -p localcache-cli --all-targets --all-features --locked

  dependency-security:
    name: Dependency security policy
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run fail-closed advisory policy
        run: >-
          python3 scripts/check_advisories.py
          "$RUNNER_TEMP/localcache-advisory-evidence"
      - name: Preserve advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-evidence
          path: ${{ runner.temp }}/localcache-advisory-evidence
          if-no-files-found: error
