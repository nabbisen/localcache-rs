name: Docs

# RFC 022 R3 items 6-7 (Amendment 3): the runner image (ubuntu-24.04) changes
# only by a deliberate, CI-verified change -- never silently via `ubuntu-latest`
# drifting underneath us.

on:
  push:
    branches:
      - main
  # manual run
  workflow_dispatch:

# RFC 009 R16 requires explicit least-privilege permissions and every third-party
# action pinned to a reviewed immutable commit SHA. RFC 022 R3 narrowed this
# further: no job needs every scope this workflow holds anywhere, so each job
# now declares only what it uses, instead of a workflow-level grant of all
# three. The workflow-level default is `contents: read`, matching `ci.yaml`.
# `build` never deploys, so it only needs `contents: read` (to check out the
# repository) plus `pages: read` (`actions/configure-pages` reads the Pages
# configuration). `deploy` needs `pages: write` to publish, and
# `actions/deploy-pages` authenticates via OIDC, which requires
# `id-token: write`; neither job is granted repository-content, package, or
# registry write access. Because this workflow does hold write scopes, its
# action pins matter more than `ci.yaml`'s, not less — each SHA below was
# resolved from the tag this workflow already referenced, and
# `actions/checkout` matches the pin `ci.yaml` uses.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install mdBook
        run: |
          curl -fL --retry 3 \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/mdbook.tar.gz"
          printf '%s  %s\n' \
            3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7 \
            "$RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$HOME/.local/bin" mdbook
          chmod 0755 "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
