name: MSRV fresh resolution

# RFC 023 R6.2: does what a new consumer does -- resolve with no Cargo.lock
# under the declared-MSRV Cargo, then build the declared-MSRV rows -- so that an
# upstream crate that declares no `rust-version` and raises its real floor
# is noticed here, before a consumer notices it.
#
# This is its own workflow, not a `schedule:` on ci.yaml: a failure caused by
# an upstream publication must not turn unrelated pushes red, and must not run
# the whole CI weekly. It is deliberately NOT part of `release-gate`.
#
# Read-only, no secrets, actions pinned by full SHA with the same pins as
# ci.yaml (RFC 009 R16). The runner image and the pins change only by a
# deliberate, CI-verified change (RFC 022 R3 items 6-7).
#
# Deliberately no cache of the registry or the target directory: either would
# hide exactly the fresh resolution this workflow exists to perform. Only the
# pinned `cargo-make` binary is cached.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv-fresh:
    name: MSRV fresh resolution (declared Rust 1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read declared MSRV
        id: msrv
        run: |
          MSRV=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          test "$MSRV" = "1.85"
          echo "toolchain=${MSRV}.0" >> "$GITHUB_OUTPUT"
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
      - name: Cache pinned gate tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-make
          key: ubuntu-24.04-gate-tools-make-0.37.24
      - name: Install pinned gate tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install cargo-make --version 0.37.24 --locked
      - name: Check a fresh resolution builds on the declared MSRV (RFC 023 R6.2)
        run: |
          # The tracked tree, in a new directory outside the checkout, without
          # its Cargo.lock: the declared-MSRV cargo resolves it as a new
          # consumer would (`resolver = "3"` falls back to MSRV-compatible
          # versions). The repository's own lockfile is never touched.
          FRESH="$RUNNER_TEMP/msrv-fresh"
          mkdir "$FRESH"
          git archive HEAD | tar -x -C "$FRESH"
          rm "$FRESH/Cargo.lock"
          cargo generate-lockfile --manifest-path "$FRESH/Cargo.toml"
          cargo make --cwd "$FRESH" gate-msrv
